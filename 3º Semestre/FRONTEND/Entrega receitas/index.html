<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Receitas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🍽️ Receitas</h1>

  <!-- BUSCA -->
  <input 
    type="text" 
    id="busca" 
    placeholder="Buscar receita..."
    oninput="buscarPublicacao(this.value)"
  >

  <!-- FORM -->
  <form onsubmit="salvar(event)">
    <input type="hidden" id="id">

    <input 
      type="text" 
      id="titulo" 
      placeholder="Título da receita"
      required
    >

    <textarea 
      id="descricao" 
      placeholder="Descrição"
      required
    ></textarea>

    <input type="file" id="imagem" accept="image/*">

    <button type="submit">Salvar</button>
  </form>

  <!-- LISTA -->
  <div id="lista"></div>
</div>

<script>
let receitas = [];

// carregar dados
function ListarPublicacao() {
  receitas = JSON.parse(localStorage.getItem("receitas")) || [];
  render();
}

// salvar / atualizar
async function salvar(event) {
  event.preventDefault();

  const id = document.getElementById("id").value;
  const titulo = document.getElementById("titulo").value;
  const descricao = document.getElementById("descricao").value;
  const fileInput = document.getElementById("imagem");

  let imagemBase64 = "";

  // valida imagem
  if (fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];

    if (!file.type.startsWith("image/")) {
      alert("Selecione uma imagem válida!");
      return;
    }

    // limitar tamanho (~1MB)
    if (file.size > 1024 * 1024) {
      alert("Imagem muito grande! Use uma menor que 1MB.");
      return;
    }

    imagemBase64 = await converterParaBase64(file);
  }

  if (id) {
    receitas = receitas.map(r =>
      r.id == id
        ? {
            id,
            titulo,
            descricao,
            imagem: imagemBase64 || r.imagem
          }
        : r
    );
  } else {
    receitas.push({
      id: Date.now(),
      titulo,
      descricao,
      imagem: imagemBase64
    });
  }

  try {
    localStorage.setItem("receitas", JSON.stringify(receitas));
  } catch (e) {
    alert("Erro ao salvar. O armazenamento pode estar cheio.");
  }

  limpar();
  render();
}

// buscar
function buscarPublicacao(texto) {
  const dados = JSON.parse(localStorage.getItem("receitas")) || [];

  const filtrados = dados.filter(r =>
    r.titulo.toLowerCase().includes(texto.toLowerCase())
  );

  render(filtrados);
}

// excluir
function excluirPublicacao(id) {
  receitas = receitas.filter(r => r.id !== id);
  localStorage.setItem("receitas", JSON.stringify(receitas));
  render();
}

// editar
function editarPublicacao(id) {
  const receita = receitas.find(r => r.id === id);

  document.getElementById("id").value = receita.id;
  document.getElementById("titulo").value = receita.titulo;
  document.getElementById("descricao").value = receita.descricao;
}

// renderizar
function render(lista = receitas) {
  const div = document.getElementById("lista");
  div.innerHTML = "";

  if (lista.length === 0) {
    div.innerHTML = "<p>Nenhuma receita encontrada.</p>";
    return;
  }

  lista.forEach(r => {
    div.innerHTML += `
      <div class="card">
        <h3>${r.titulo}</h3>

        ${r.imagem ? `<img src="${r.imagem}" class="imagem">` : ""}

        <p>${r.descricao}</p>

        <div class="acoes">
          <button onclick="editarPublicacao(${r.id})">Editar</button>
          <button onclick="excluirPublicacao(${r.id})">Excluir</button>
        </div>
      </div>
    `;
  });
}

// limpar form
function limpar() {
  document.getElementById("id").value = "";
  document.getElementById("titulo").value = "";
  document.getElementById("descricao").value = "";
  document.getElementById("imagem").value = "";
}

// converter imagem
function converterParaBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);

    reader.readAsDataURL(file);
  });
}

// iniciar
ListarPublicacao();
</script>

</body>
</html>
