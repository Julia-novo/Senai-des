<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Eventos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Lista de Eventos</h1>
</header>

<div class="container">
  <button onclick="abrirModal()">Cadastrar Evento</button>
  <div id="lista"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Novo Evento</h3>
    <input id="nome" placeholder="Nome"><br><br>
    <button onclick="salvarEvento()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
